server {
    listen 3000;
    server_name _;

    # Ensure redirects (like the automatic trailing slash redirects) stay on
    # the public origin instead of pointing clients back to the internal
    # container port. Without this Radix would issue redirects to
    # `:3000`, and browsers would time out because that port isn't exposed.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # The demo is a static export with an index.html for every page (/ and
    # /preview/), so a path without a file is a 404, not the start page.
    # Pages and other un-hashed files are revalidated on every request, so a
    # deploy shows at once; nginx sends ETag and Last-Modified, so an
    # unchanged file is a cheap 304.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # Next.js puts a content hash in the name of every file under
    # /_next/static/, so a given file never changes.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    error_page 404 /404.html;

    # Enable gzip compression
    gzip on;
    gzip_types
        text/plain
        application/json
        application/xml
        application/javascript
        application/x-javascript
        text/javascript
        text/xml
        text/css;
    gzip_proxied no-cache no-store private expired auth;
    gzip_min_length 1000;
}
