server {
    listen 3000;
    server_name _;

    # Ensure redirects (like the automatic trailing slash redirects) stay on
    # the public origin instead of pointing clients back to the internal
    # container port. Without this Radix would issue redirects to
    # `:3000`, and browsers would time out because that port isn't exposed.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Content-hashed build assets (assets/*-<hash>.js etc.) never change for a
    # given filename, so they are safe to cache "forever".
    # ^~ makes this prefix match win over the regex locations below.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Un-hashed Storybook files (index.html, iframe.html, sb-manager/**,
    # sb-addons/**, project.json, etc.) must always be revalidated. Caching
    # these for long periods causes mixed-version bundles after a deploy
    # (e.g. "api.getNavAvailability is not a function", see #5205).
    # nginx sends ETag/Last-Modified by default, so revalidation is a cheap 304.
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html to ensure updates are reflected
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Cache other static assets (images, fonts, etc.)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types
        text/plain
        application/json
        application/xml
        application/javascript
        application/x-javascript
        text/javascript
        text/xml
        text/css;
    gzip_proxied no-cache no-store private expired auth;
    gzip_min_length 1000;
}
