<link
  rel="stylesheet"
  href="https://cdn.eds.equinor.com/font/eds-uprights-vf.css"
/>

<style>
  html {
    height: 100%;
  }
  .sb-show-main {
    min-height: 100%;
  }
  @scope (.sbdocs-content) to (.docs-story, .sb-unstyled), {
    * {
      font-family: Equinor, sans-serif !important;
    }
  }

  /* Wrapped in @layer so component CSS in @layer eds-components wins
     naturally (unlayered styles outrank any layer). The layer name is
     declared here first, so it is the lowest-priority layer in the cascade. */
  @layer storybook {
    :where(h1, h2, h3, h4, h5, h6) {
      font-family: Equinor, sans-serif;
    }
  }

  .sbdocs.sbdocs-a {
    font-size: inherit;
  }
</style>

<script>
  // Embeds of iframe.html?id=eds-2-0-beta-… from before the beta section was
  // renamed (#5749). See manager-head.html for the sidebar links.
  ;(function () {
    var search = window.location.search
    var next = search.replace(/([?&]id=)eds-2-0-beta-/, '$1beta-')
    if (next !== search) {
      window.history.replaceState(
        null,
        '',
        window.location.pathname + next + window.location.hash,
      )
    }
  })()
</script>
