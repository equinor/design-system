version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: 'chore(deps)'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Oslo
    groups:
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
      # The mobile packages (apps/mobile-storybook and eds-mobile-components)
      # use one React version, the one the Expo SDK bundles, and change it with
      # the SDK. If a bump from this group moves only some of them, the mobile
      # tree ends up with two React versions and the tests fail with an invalid
      # hook call, so revert those packages there (#5490, #5731, #5580).
      # test-renderer, which @testing-library/react-native 14 uses, follows
      # React's minor line (1.3 for React 19.3) and is held to it with a ~ range
      # in eds-mobile-components, so change it together with React.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-aria:
        patterns:
          - 'react-aria'
          - '@react-aria/*'
          - '@react-stately/*'
          - '@react-types/*'
          - '@internationalized/*'
      rollup:
        patterns:
          - 'rollup'
          - '@rollup/*'
          - 'rollup-plugin-*'
      tanstack:
        patterns:
          - '@tanstack/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - '@eslint/*'
      testing:
        patterns:
          - 'jest'
          - 'jest-*'
          - 'ts-jest'
          - 'babel-jest'
          - '@testing-library/*'
          - '@types/jest'
          - '@playwright/test'
      all-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # @types/react is pinned exactly in pnpm-workspace.yaml overrides so the
      # tree cannot split (#5484). Bump the override and the specifiers together.
      - dependency-name: '@types/react'
      - dependency-name: 'eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'eslint-*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript-eslint'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@typescript-eslint/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@eslint/*'
        update-types:
          - 'version-update:semver-major'
    cooldown:
      default-days: 5
    versioning-strategy: increase
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: 'chore(deps)'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Oslo
    groups:
      all-actions:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
