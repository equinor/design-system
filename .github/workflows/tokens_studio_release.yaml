name: Tokens Studio release
# Triggered by the outbound CI trigger in Tokens Studio (Integrations →
# CI Triggers). Studio sends a repository_dispatch event with this event
# type when a release is created. Note: repository_dispatch only triggers
# workflows on the default branch.
#
# The payload does not include the release version, so the workflow pulls
# the current state of the sources configured in
# packages/eds-tokens/.studio.json and opens a PR with any changes.
on:
  repository_dispatch:
    types: [tokens-release]
# Two releases in quick succession would otherwise race on the shared
# tokens-studio-release branch — serialise runs instead
concurrency:
  group: tokens-studio-release
  cancel-in-progress: false
jobs:
  setup:
    permissions:
      contents: read
    uses: ./.github/workflows/_setup.yml
    secrets: inherit
    with:
      cacheKey: ${{ github.sha }}-tokens-studio-release
  pull-tokens:
    name: Pull tokens from Tokens Studio
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15
    permissions:
      # OIDC token so the studio CLI can authenticate against the
      # Tokens Studio CI integration (no service token needed)
      id-token: write
      # Create the branch and pull request with the pulled changes
      contents: write
      pull-requests: write
    steps:
      - name: Log release payload
        env:
          EVENT_TYPE: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Received repository_dispatch event: $EVENT_TYPE"
          echo "$CLIENT_PAYLOAD" | jq .
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'
      - name: Use "setup" cache
        id: setup-cache
        uses: actions/cache@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ github.sha }}-tokens-studio-release
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      # Fallback if the cache from the setup job was evicted — without it
      # the workspace is empty and the studio binary is missing
      - name: Checkout (cache-miss fallback)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
      - name: Install dependencies (cache-miss fallback)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: pnpm install --force
      - name: Pull tokens from Tokens Studio
        run: pnpm --filter @equinor/eds-tokens exec studio tokens pull --ci --verbose
      # `studio exports run` writes over the previous release's files
      # without pruning, and the TS generator discovers its inputs from
      # whatever is on disk (see buildContext). A folder renamed upstream
      # would otherwise leave both copies behind and abort the run, and a
      # removed one would keep resolving to its stale value.
      - name: Clear the previous generated exports
        run: rm -rf packages/eds-tokens/src/tokens/css packages/eds-tokens/src/tokens/dtcg
      # Runs the saved export configurations on the platform and writes
      # the generated files. This output will replace the local Style
      # Dictionary build in the new pipeline — it is not yet wired into
      # the package exports map.
      # The exports are referenced by ID, not name — a rename in Tokens
      # Studio must not break the pipeline (it already happened once).
      # --verbose because the run is unattended and the resulting PR gets
      # no CI — the Actions log is the only place to diagnose a bad export
      - name: Run CSS export from Tokens Studio (EDS-CSS)
        run: pnpm --filter @equinor/eds-tokens exec studio exports run 39d37416-632b-4f04-b49b-cfaec63e3baa --ci --verbose --out src/tokens/css
      - name: Run DTCG export from Tokens Studio (EDS-DTCG)
        run: pnpm --filter @equinor/eds-tokens exec studio exports run 019463d4-9bef-4e37-9425-6de80eec87c8 --ci --verbose --out src/tokens/dtcg
      # The foundation and input sets are the palette maths. They stay
      # Enabled in Studio (#5551), which cannot yet leave them out of an
      # export, so they land in every colour-scheme file. Nothing
      # published references them, so strip them before the TS modules
      # and the bundle are built (#5657). Warns, without failing, once
      # there is nothing left to strip.
      - name: Strip internal token sets (foundation, input)
        run: pnpm --filter @equinor/eds-tokens run strip:internal-token-sets
      # TypeScript token modules are generated locally from the DTCG
      # export (structure) + CSS export (evaluated values) — the platform
      # has no TS export format. See the script header for details.
      - name: Generate TypeScript tokens
        run: pnpm --filter @equinor/eds-tokens run generate:ts-tokens
      # Widen the semantic layer to [data-color-scheme] and [data-density],
      # and the density base to [data-density="comfortable"] (#5226, #5247 —
      # scripts/widen-semantic-scope.mjs rewrites the generated
      # src/tokens/css/semantic/*.css and density/comfortable.css in place,
      # so those selector changes are expected in this PR's diff), then
      # concatenate the generated CSS into one committed bundle
      # (deliberately not minified — ADR-0010). The bundler adds two
      # things of its own: the @layer eds-tokens wrap (ADR-0028 point 6,
      # #5423) and a generic sans-serif on every --eds-family-*
      # declaration (#5701), which is why those two lines differ from
      # the export files in this PR's diff. It is appended here rather
      # than in the export because generate-ts-tokens.mjs above reads
      # the same files, and React Native's fontFamily takes one family
      # name. Importable on
      # the beta line as @equinor/eds-tokens/next/css/variables.css via
      # the ./next/css/* wildcard publish_tokens.yaml already injects.
      - name: Widen semantic scope and bundle CSS into variables.css
        run: pnpm --filter @equinor/eds-tokens run generate:css-bundle
      # The CSS name transform is not injective (`.` and `-` both
      # flatten to `-`), so two distinct tokens can land on the same
      # custom property and, where one aliases the other, emit a
      # self-referential declaration that resolves to nothing — this is
      # what dropped the beta focus ring on Button and Chip (#5407,
      # ADR-0014). Tokens Studio resolves by token name, where the two
      # are distinct, so the platform preview looks healthy and only the
      # built CSS shows it.
      # Deliberately placed before Create Pull Request: a failure here
      # opens no PR at all, so a colliding export cannot be merged by
      # someone reading a green-looking diff. The run fails, the
      # log-errors-to-slack step below fires, and the offending names
      # are listed in the Actions log — which is the only diagnostic
      # surface this workflow has, since the PR it creates gets no CI.
      # generate:css-bundle chains the same check, so a local pipeline
      # run gets the same guard. Keeping the step anyway: it is the name
      # that appears in the Slack failure payload, where "Widen semantic
      # scope and bundle CSS" would not say what actually went wrong.
      - name: Check for colliding custom-property names
        run: pnpm --filter @equinor/eds-tokens run check:css:names
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # feat: so release-please cuts an eds-tokens beta (3.0.0-beta.N)
          # when the PR is squash-merged (chore: would not trigger a
          # release). During the beta the commit type doesn't affect the
          # version — the prerelease strategy pins the base and only
          # increments the counter — but feat lands the entry under
          # "Added" in the changelog, which is what a token update is.
          commit-message: 'feat: update tokens from Tokens Studio release'
          title: 'feat: update tokens from Tokens Studio release'
          # Deliberately short. The same body lands on every token
          # release PR, so anything that does not change between runs is
          # documentation and belongs in TOKENS_STUDIO.md, which this
          # links to. What a reviewer needs on the PR itself is where to
          # look, what to ignore, and what has already been checked.
          # One paragraph per line, however long: GitHub renders a single
          # newline in a PR body as a line break, so wrapping these lines
          # for the sake of the YAML would wrap them in the rendered PR
          # too. A folded scalar (`>`) does not solve it either, since it
          # collapses the blank line between two paragraphs to the single
          # newline that GitHub shows as a break rather than a paragraph.
          body: |
            Automated pull of the token state after a Tokens Studio release. Review the token value changes in `packages/eds-tokens/src/tokens/`. Everything else in the diff is generated by the pipeline, including the widened `semantic/*.css` and `density/comfortable.css` selectors and the concatenated `css/variables.css` bundle.

            The name-collision check (#5407) passed before this PR opened. The PR gets no CI runs of its own, so that is the only gate it has passed.

            Pipeline details: `documentation/agent-instructions/TOKENS_STUDIO.md`.
          branch: tokens-studio-release
      # This workflow runs unattended (release-triggered) and the PR it
      # creates gets no CI runs, so a failed pull must not be silent
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
