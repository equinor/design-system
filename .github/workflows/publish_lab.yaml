name: Publish lab-react
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'Tag for npm package (next | latest)'
        required: true
        type: choice
        options:
          - next
          - latest
        default: 'next'
      environment:
        description: 'Environment for Storybook (development | production)'
        required: false
        type: choice
        options:
          - development
          - production
        default: 'development'
env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  NODE_VERSION: '24.16.0'
  CACHE_KEY: ${{ github.sha }}-publish-lab

jobs:
  setup:
    name: Setup
    uses: ./.github/workflows/_setup.yml
    secrets: inherit
    with:
      cacheKey: ${{ github.sha }}-publish-lab
      tag: ${{ github.event.inputs.npm-tag }}

  build:
    name: Build packages & Storybook
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Restore workspace cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Build packages
        run: pnpm run build
      - name: Build lab Storybook
        run: pnpm build:storybook:lab
      - name: Cache build output
        uses: actions/cache/save@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  # eds-utils is deliberately not published here. publish_core_react.yaml is
  # the only workflow registered as a trusted publisher for the package, so
  # this workflow would fail with an OIDC 404 the moment it met an
  # unpublished utils version (#4932). trigger_publish.yml routes every eds-utils bump to
  # publish_core_react.yaml instead, and the check below turns the missing
  # dependency into a clear failure rather than a broken release.
  publish-lab:
    name: Publish lab to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # eds-lab-react depends on @equinor/eds-utils with workspace:^, which
      # pnpm publish rewrites to a concrete range. If that version never
      # reached npm, the published lab package carries a dependency nobody
      # can install. Fail here instead, with the fix in the error message.
      - name: Verify eds-utils is on npm
        run: |
          UTILS_VERSION=$(node -p "require('./packages/eds-utils/package.json').version")
          if ! npm view "@equinor/eds-utils@$UTILS_VERSION" version > /dev/null 2>&1; then
            echo "::error title=eds-utils not published::@equinor/eds-utils@$UTILS_VERSION is missing from npm. eds-lab-react depends on it via workspace:^ and would publish an unresolvable range. Publish eds-utils first by running publish_core_react.yaml with npm-tag=latest, then re-run this workflow (see #4932)."
            exit 1
          fi
          echo "@equinor/eds-utils@$UTILS_VERSION is on npm"
      - name: Publish to npm
        run: pnpm --filter @equinor/eds-lab-react publish --access public --provenance --tag ${{ github.event.inputs.npm-tag }} --no-git-checks
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  publish-storybook:
    name: Publish Storybook
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Keep checkout first: actions/checkout cleans the workspace and would
      # wipe the Storybook build restored by the next step.
      - name: Checkout deploy action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: Deploy the website
        uses: ./.github/actions/deploy-storybook
        with:
          folder: packages/eds-lab-react/storybook-build
          connection-string: ${{ secrets.AZ_STORAGE_STORYBOOK_LAB_CONNECTION_STRING }}
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
