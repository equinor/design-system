# Marks who owns a PR and whether a reviewer has left comments for the author.
#
# - When a PR is opened, the author is assigned.
# - When someone other than the author submits a Comment or Request changes
#   review, the PR gets the `awaiting author` label. Approvals do not add it,
#   because nits on an approval are optional.
# - When new commits are pushed, the label is removed.
#
# Uses only the built-in token (pull-requests: write), so it needs no secret.
# It never checks out or runs code from the PR. Bot PRs and PRs from forks are
# skipped: the built-in token is read-only on forks, and bot PRs follow their
# own routines (see AGENTS.md § PR Reviews and the Project Board).
name: PR review signals
on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  assign-author:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'opened' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Assign the author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/assignees" -f "assignees[]=$AUTHOR"

  add-awaiting-author:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state != 'approved' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.review.user.type != 'Bot' &&
      github.event.review.user.login != github.event.pull_request.user.login
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Add the awaiting author label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=awaiting author"

  remove-awaiting-author:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'awaiting author')
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove the awaiting author label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/awaiting%20author"
