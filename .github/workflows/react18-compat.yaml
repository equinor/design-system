name: React 18 compatibility
permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'

env:
  NODE_VERSION: '24.16.0'

jobs:
  setup:
    uses: ./.github/workflows/_setup.yml
    secrets: inherit
    with:
      cacheKey: ${{ github.sha }}-react18
  react18:
    name: Build & test with React 18
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Use "setup" cache
        id: setup-cache
        uses: actions/cache@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ github.sha }}-react18
      - name: Fallback checkout (cache miss)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Fallback install (cache miss)
        if: steps.setup-cache.outputs.cache-hit != 'true'
        run: pnpm install
      - name: Override to React 18
        run: |
          pnpm add -Dw react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - name: Build packages
        run: pnpm run build
      # Explicit list rather than the root `test` aggregate: mobile's tests
      # exercise React Native under packages/eds-mobile-components's own
      # exact react@19.2.8 devDependency, which the -Dw override above
      # doesn't touch. Running them here would add cost with zero React 18
      # signal, and could red this job for reasons that have nothing to do
      # with React 18 compatibility.
      - name: Test packages
        run: |
          pnpm run test:utils
          pnpm run test:core-react
          pnpm run test:lab
          pnpm run test:data-grid-react
          pnpm run test:color-palette-generator
      - name: Type check packages
        run: |
          pnpm --filter @equinor/eds-tokens types
          pnpm --filter @equinor/eds-utils types
          pnpm --filter @equinor/eds-icons types
          pnpm --filter @equinor/eds-core-react types
          pnpm --filter @equinor/eds-lab-react types
          pnpm --filter @equinor/eds-data-grid-react types
