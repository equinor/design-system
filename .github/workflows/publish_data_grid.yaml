name: Publish data-grid-react
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: 'Tag for npm package (next | latest)'
        required: true
        type: choice
        options:
          - next
          - latest
        default: 'next'
      environment:
        description: 'Environment for Storybook (development | production)'
        required: false
        type: choice
        options:
          - development
          - production
        default: 'development'
env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  NODE_VERSION: '24.16.0'
  CACHE_KEY: ${{ github.sha }}-publish-data-grid

jobs:
  setup:
    name: Setup
    uses: ./.github/workflows/_setup.yml
    secrets: inherit
    with:
      cacheKey: ${{ github.sha }}-publish-data-grid
      tag: ${{ github.event.inputs.npm-tag }}

  build:
    name: Build packages & Storybook
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Restore workspace cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Build packages
        run: pnpm run build
      - name: Build data-grid Storybook
        run: pnpm build:storybook:data-grid
      - name: Cache build output
        uses: actions/cache/save@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  publish-package:
    name: Publish data grid to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      # eds-data-grid-react depends on @equinor/eds-utils with workspace:^, which
      # pnpm publish rewrites to a concrete range. If that version never
      # reached npm, the published package carries a dependency nobody can
      # install. trigger_publish.yml dispatches publish_core_react.yaml (which
      # publishes eds-utils) in parallel with this workflow, and its build is
      # slower, so wait up to 20 minutes before failing (#4932).
      - name: Wait for eds-utils on npm
        run: |
          UTILS_VERSION=$(node -p "require('./packages/eds-utils/package.json').version")
          for i in $(seq 1 40); do
            if NPM_ERROR=$(npm view "@equinor/eds-utils@$UTILS_VERSION" version 2>&1 >/dev/null); then
              echo "@equinor/eds-utils@$UTILS_VERSION is on npm"
              exit 0
            fi
            echo "Waiting for @equinor/eds-utils@$UTILS_VERSION to reach npm ($i/40)"
            sleep 30
          done
          echo "Last npm view output:"
          echo "$NPM_ERROR"
          echo "::error title=eds-utils not published::@equinor/eds-utils@$UTILS_VERSION is still missing from npm after 20 minutes. eds-data-grid-react depends on it via workspace:^ and would publish an unresolvable range. Check the publish_core_react.yaml run, or run it with npm-tag=latest, then re-run this workflow (see #4932)."
          exit 1
      - name: Publish to npm
        run: pnpm --filter @equinor/eds-data-grid-react publish --access public --provenance --tag ${{ github.event.inputs.npm-tag }} --no-git-checks
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()

  publish-storybook:
    name: Publish Storybook
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Keep checkout first: actions/checkout cleans the workspace and would
      # wipe the Storybook build restored by the next step.
      - name: Checkout deploy action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ./*
            ~/.pnpm-store
          key: ${{ env.CACHE_KEY }}-built
      - name: Deploy the website
        uses: ./.github/actions/deploy-storybook
        with:
          folder: packages/eds-data-grid-react/storybook-build
          connection-string: ${{ secrets.AZ_STORAGE_STORYBOOK_DATAGRID_CONNECTION_STRING }}
      - name: log-errors-to-slack
        uses: act10ns/slack@v2
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
        if: failure()
